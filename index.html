  * { box-sizing:border-box; margin:0; padding:0; }
  body { min-height:100vh; background:var(--fondo); color:var(--texto);
         font-family:-apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
         display:flex; flex-direction:column; align-items:center; padding:48px 24px 32px; }
  .marca { font-size:13px; letter-spacing:.25em; text-transform:uppercase; color:var(--suave); }
  /* El disco que gira es el del logo (imagen incrustada abajo, en --logo-disco) */
  .disco { width:min(64vw,260px); aspect-ratio:1; border-radius:50%; margin:36px 0 28px;
           background:var(--logo-disco) center/contain no-repeat;
           box-shadow:0 10px 40px rgba(0,0,0,.6), 0 0 0 1px #2a2a2a; animation:girar 6s linear infinite; }
  /* En la página de cada playlist: vinilo negro con la etiqueta de esa playlist en el centro
     (etiqueta 38 mm sobre disco de 84 mm = 45 %). Las imágenes están en la carpeta etiquetas/ */
  .disco.vinilo { background:
      var(--etiqueta) center/45.2% no-repeat,
      radial-gradient(circle, transparent 23%, rgba(255,255,255,.05) 23.5%, transparent 24.5%),
      repeating-radial-gradient(circle, #1a1a1a 0 1px, #0b0b0b 1px 3px); }
  @keyframes girar { to { transform:rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .disco { animation:none; } }
  h1 { font-size:28px; font-weight:700; text-align:center; line-height:1.2; }
  .sub { color:var(--suave); margin-top:8px; text-align:center; font-size:15px; }
  .botones { width:100%; max-width:340px; display:flex; flex-direction:column; gap:12px; margin-top:32px; }
  .boton { display:block; text-align:center; text-decoration:none; font-weight:700; font-size:17px;
           padding:16px; border-radius:999px; color:#fff; }
  .spotify { background:#1db954; color:#000; }
  .youtube { background:#e62117; }
  .lista { width:100%; max-width:340px; display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:32px; }
  .lista a { display:block; padding:14px 10px; border:1px solid #333; border-radius:12px; text-align:center;
             color:var(--texto); text-decoration:none; font-size:14px; }
  footer { margin-top:auto; padding-top:40px; font-size:13px; color:var(--suave); }
  footer a { color:var(--suave); }
</style>

  // La etiqueta que gira sale de etiquetas/CLAVE.webp (misma clave).
  const PLAYLISTS = {
    "navidad":     { nombre: "Navidad / Año Nuevo", color: "#c0392b", spotify: "https://open.spotify.com/playlist/04LGfKSh2LspPSLB3c9TXt?si=x2whUnnjR16PhIEuTdmL6Q", youtube: "" },
    "70s":         { nombre: "70s",                 color: "#e67e22", spotify: "", youtube: "" },
    "80s":         { nombre: "80s",                 color: "#e84393", spotify: "", youtube: "" },
    "90s":         { nombre: "90s",                 color: "#6c5ce7", spotify: "", youtube: "" },
    "retro":       { nombre: "Retro",               color: "#d4a24c", spotify: "", youtube: "" },
    "pop":         { nombre: "Pop",                 color: "#fd79a8", spotify: "", youtube: "" },
    "relax":       { nombre: "Relax",               color: "#74b9ff", spotify: "", youtube: "" },
    "alternative": { nombre: "Alternative",         color: "#00b894", spotify: "", youtube: "" },
    "indie-folk":  { nombre: "Indie / Folk",        color: "#a3845b", spotify: "", youtube: "" },
    "ruta":        { nombre: "Para la ruta",        color: "#2e7d4f", spotify: "", youtube: "" },
    "rock":        { nombre: "Rock",                color: "#b33939", spotify: "", youtube: "" },
    "electronica": { nombre: "Electrónica",         color: "#3fe0ff", spotify: "", youtube: "" },
    "cafe":        { nombre: "Café",                color: "#8d6e63", spotify: "", youtube: "" },
    "rock-nacional": { nombre: "Rock Nacional",     color: "#74acdf", spotify: "", youtube: "" },
    "reggaeton":   { nombre: "Reggaetón",           color: "#b6ff3b", spotify: "", youtube: "" },
    "salsa":       { nombre: "Salsa",               color: "#ff6a3d", spotify: "", youtube: "" },
    "folklore":    { nombre: "Folklore",            color: "#c0392b", spotify: "", youtube: "" },
    "cumbia":       { nombre: "Cumbia",                color: "#ff2d8a", spotify: "", youtube: "" },
    "cuarteto":     { nombre: "Cuarteto",              color: "#14a396", spotify: "", youtube: "" },
    "tango":        { nombre: "Tango",                 color: "#d4a24c", spotify: "", youtube: "" },
    "romanticos-en":{ nombre: "Románticos en inglés",  color: "#ff5c7a", spotify: "", youtube: "" },
    "romanticos-es":{ nombre: "Románticos en español", color: "#e8364f", spotify: "", youtube: "" },
    "infantil":     { nombre: "Infantil",              color: "#3fb6ff", spotify: "", youtube: "" },
    "trap":         { nombre: "Trap Argentino",        color: "#9b5cff", spotify: "", youtube: "" }
  };
  // ────────────────────────────────────────────────────────────────

  const clave = new URLSearchParams(location.search).get("p");
  const pl = PLAYLISTS[clave];
  const titulo = document.getElementById("titulo");
  const sub = document.getElementById("sub");

  if (pl) {
    document.documentElement.style.setProperty("--color", pl.color);
    document.title = pl.nombre + " · 3D Disks";
    // Etiqueta del disco: si la imagen no carga, queda el disco del logo
    const img = new Image();
    img.onload = () => {
      const disco = document.querySelector(".disco");
      disco.style.setProperty("--etiqueta", 'url("' + img.src + '")');
      disco.classList.add("vinilo");
    };
    img.src = "etiquetas/" + clave + ".webp";
    titulo.textContent = pl.nombre;
    const botones = document.getElementById("botones");
    [["spotify", "Escuchar en Spotify"], ["youtube", "Escuchar en YouTube"]].forEach(([plat, texto]) => {
      if (!pl[plat]) return;
      const a = document.createElement("a");
      a.className = "boton " + plat;
      a.href = pl[plat];
      a.textContent = texto;
      botones.appendChild(a);
    });
    sub.textContent = botones.children.length ? "Elegí dónde escucharla" : "Esta playlist está en camino 🎶";
  } else {
    titulo.textContent = "Nuestros discos";
    sub.textContent = "Elegí una playlist";
    const lista = document.getElementById("lista");
    Object.entries(PLAYLISTS).forEach(([k, v]) => {
      const a = document.createElement("a");
      a.href = "?p=" + k;
      a.textContent = v.nombre;
      a.style.borderColor = v.color;
      lista.appendChild(a);
    });
  }
</script>
</body>
</html>
